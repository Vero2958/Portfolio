version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb_container
    environment:
      MYSQL_ROOT_PASSWORD: root-pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  neo4j:
    image: neo4j:5.9.0
    container_name: neo4j_container
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  python_script:
    image: python.3.10
    build: ./traits
    container_name: python_script_container
    depends_on:
      - mariadb
      - neo4j

volumes:
  mariadb_data:
  neo4j_data:
